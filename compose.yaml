services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ufabc_ranking}
      POSTGRES_USER: ${POSTGRES_USER:-ufabc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ufabc}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ufabc} -d ${POSTGRES_DB:-ufabc_ranking}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ufabc}:${POSTGRES_PASSWORD:-ufabc}@db:5432/${POSTGRES_DB:-ufabc_ranking}
      IMPORT_STORAGE_PATH: /workspace/var/imports
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      UFABC_NEXT_ENABLED: ${UFABC_NEXT_ENABLED:-true}
      UFABC_NEXT_BASE_URL: ${UFABC_NEXT_BASE_URL:-https://api.v2.ufabcnext.com}
      UFABC_NEXT_TIMEOUT_SECONDS: ${UFABC_NEXT_TIMEOUT_SECONDS:-15}
      UFABC_NEXT_MAX_RETRIES: ${UFABC_NEXT_MAX_RETRIES:-0}
      UFABC_NEXT_BACKOFF_SECONDS: ${UFABC_NEXT_BACKOFF_SECONDS:-5.0}
      UFABC_NEXT_MIN_INTERVAL_SECONDS: ${UFABC_NEXT_MIN_INTERVAL_SECONDS:-5.0}
      UFABC_NEXT_MAX_REQUESTS_PER_SYNC: ${UFABC_NEXT_MAX_REQUESTS_PER_SYNC:-30}
      UFABC_NEXT_COMPONENT_CACHE_SECONDS: ${UFABC_NEXT_COMPONENT_CACHE_SECONDS:-86400}
      UFABC_NEXT_REVIEW_CACHE_SECONDS: ${UFABC_NEXT_REVIEW_CACHE_SECONDS:-7776000}
      UFABC_NEXT_SYNC_STALE_SECONDS: ${UFABC_NEXT_SYNC_STALE_SECONDS:-3600}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - import-data:/workspace/var/imports

volumes:
  postgres-data:
  import-data:
